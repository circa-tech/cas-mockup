name: CIRCA-202 browser QA

on:
  push:
    branches: [codex/qa-circa-202-platforms]

permissions:
  contents: read

jobs:
  windows-chrome:
    name: Windows / Chrome
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Test Chrome with real browser downloads
        run: npm run test:offline -- --grep "chart export follows the brush" --timeout=45000
        env:
          PLAYWRIGHT_CHANNEL: chrome
          PLAYWRIGHT_PORT: '4948'

  macos-safari:
    name: macOS / Safari WebDriver
    runs-on: macos-latest
    timeout-minutes: 12
    env:
      VITE_API_BASE_URL: http://127.0.0.1:4948
      VITE_FIREBASE_PROJECT_ID: offline-test
      VITE_FIREBASE_API_KEY: offline-test-key
      VITE_FIREBASE_AUTH_DOMAIN: offline-test.firebaseapp.com
      VITE_FIREBASE_APP_ID: offline-test-app
      VITE_FIREBASE_STORAGE_BUCKET: offline-test.appspot.com
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - name: Enable Safari automation on the disposable runner
        run: |
          sw_vers
          /usr/bin/safaridriver --version
          sudo /usr/bin/safaridriver --enable
      - name: Verify brush and generated workbook in native Safari
        run: python3 scripts/platform-qa/safari_check.py
